<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Huawei Brief · Shahen Srour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    /* EN/AR text for this page. Shares the language choice saved by the main site. */
    (function () {
      var KEY = "portfolio-lang";
      var TEXT = {
        en: {
          pageTitle: "Huawei Brief · Shahen Srour",
          back: "Back to portfolio",
          eyebrow: "Huawei Brief",
          title: "Currently in preparation",
          lead: "Thank you for your interest. I am finalising a brief prepared specifically for Huawei, and it will be published on this page once complete.",
          statusLabel: "Expected completion",
          date: "11 November 2026",
          sign: "With thanks,",
          name: "Shahen Srour",
          toggle: "عربي",
          toggleAria: "Switch to Arabic"
        },
        ar: {
          pageTitle: "موجز هواوي · شاهين سرور",
          back: "العودة إلى معرض أعمالي",
          eyebrow: "موجز هواوي",
          title: "قيد الإعداد حالياً",
          lead: "شكراً لاهتمامك. أعمل حالياً على إعداد موجز خاص بشركة هواوي، وسيُنشر على هذه الصفحة فور اكتماله.",
          statusLabel: "موعد الإنجاز المتوقع",
          date: "11 نوفمبر 2026",
          sign: "مع خالص الشكر،",
          name: "شاهين سرور",
          toggle: "EN",
          toggleAria: "التبديل إلى الإنجليزية"
        }
      };

      var lang = "en";
      try { if (localStorage.getItem(KEY) === "ar") lang = "ar"; } catch (e) {}
      var root = document.documentElement;
      root.lang = lang;
      root.dir = lang === "ar" ? "rtl" : "ltr";

      function apply(l) {
        var t = TEXT[l];
        lang = l;
        root.lang = l;
        root.dir = l === "ar" ? "rtl" : "ltr";
        document.title = t.pageTitle;
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          if (t[el.dataset.i18n] !== undefined) el.textContent = t[el.dataset.i18n];
        });
        var toggle = document.getElementById("lang-toggle");
        toggle.setAttribute("aria-label", t.toggleAria);
        toggle.lang = l === "ar" ? "en" : "ar";
      }

      document.addEventListener("DOMContentLoaded", function () {
        apply(lang);
        document.getElementById("lang-toggle").addEventListener("click", function () {
          var next = lang === "ar" ? "en" : "ar";
          apply(next);
          try { localStorage.setItem(KEY, next); } catch (e) {}
        });
      });
    })();
  </script>
</head>
<body class="brief-page">

  <a class="brief-back" href="index.html">
    <svg class="back-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    <span data-i18n="back">Back to portfolio</span>
  </a>

  <button type="button" class="lang-toggle" id="lang-toggle" lang="ar"
          aria-label="Switch to Arabic" data-i18n="toggle">عربي</button>

  <main class="brief">
    <p class="brief-eyebrow" data-i18n="eyebrow">Huawei Brief</p>
    <h1 class="brief-title" data-i18n="title">Currently in preparation</h1>
    <span class="divider" aria-hidden="true"></span>
    <p class="brief-lead" data-i18n="lead">Thank you for your interest. I am finalising a brief prepared specifically for Huawei, and it will be published on this page once complete.</p>

    <div class="brief-status">
      <span class="status-dot" aria-hidden="true"></span>
      <p class="status-text">
        <span class="status-label" data-i18n="statusLabel">Expected completion</span>
        <time class="status-date" datetime="2026-11-11" data-i18n="date">11 November 2026</time>
      </p>
    </div>

    <p class="brief-sign">
      <span data-i18n="sign">With thanks,</span>
      <span class="brief-name" data-i18n="name">Shahen Srour</span>
    </p>
  </main>

</body>
</html>
